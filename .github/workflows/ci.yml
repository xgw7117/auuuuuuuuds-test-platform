name: UDS Test CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Java 环境
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-html python-can udsoncan can-isotp pyyaml allure-pytest
        wget https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
        tar -zxvf allure-2.30.0.tgz
        sudo mv allure-2.30.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

    - name: 执行自动化测试（生成Allure数据）
      run: |
        pytest test_uds_api.py -s --alluredir=./allure-results

    - name: 生成Allure静态报告
      run: |
        allure generate ./allure-results -o ./allure-report --clean

    - name: 上传Allure报告
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/